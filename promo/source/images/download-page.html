<style>

  :root {
    --bg: #eef5fb; --paper: #ffffff; --ink: #0b2233; --muted: #4a6478; --line: #c9d9e6; --accent: #1f6fa8; --gold: #ffd28a; --on-gold: #0a1a2e;

  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #071423; --paper: #0e2236; --ink: #eef3f7; --muted: #a3b9cc; --line: #20405e; --accent: #9fd3e6; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #071423; --paper: #0e2236; --ink: #eef3f7; --muted: #a3b9cc; --line: #20405e; --accent: #9fd3e6; color-scheme: dark; }
  body { background: var(--bg); color: var(--ink); font-family: var(--round); font-size: 15px; line-height: 1.7;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; }
  .wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
  header h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: 0.04em; text-wrap: balance; }
  header p { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }
  .btn { font: inherit; font-weight: 800; font-size: 15px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; cursor: pointer;
    background: var(--gold); color: var(--on-gold); }
  .btn.ghost { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .status { margin: 0; min-height: 1.7em; color: var(--muted); font-size: 14px; }
  section h2 { margin: 0 0 12px; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; }
  .card { min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .thumb { display: grid; place-items: center; background: repeating-conic-gradient(var(--line) 0% 25%, transparent 0% 50%) 0 0 / 16px 16px; border-radius: 10px; aspect-ratio: 1 / 1; overflow: hidden; }
  .thumb img { max-width: 100%; max-height: 100%; display: block; }
  .card b { font-size: 14px; }
  .card small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .card .btn { min-height: 40px; font-size: 14px; }
  .note { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>宣伝画像の保存</h1>
      <p>クジラが見てるの宣伝画像を、文字も絵も1枚にまとめたPNGで保存できます。大きさは投稿にそのまま使える実寸です。</p>
    </div>
    <button class="btn" id="all" disabled>全部まとめて保存(zip)</button>
  </header>
  <p class="status" id="status" role="status">文字の形と絵を読みこんでいます…</p>
  <div id="groups"></div>
  <p class="note" id="fallback" hidden>このページからは保存の画面を出せないようです。画像を長押し(パソコンでは右クリック)して「画像を保存」で保存してください。</p>
</div>

  }
  async function start() {
    const ok = await loadFonts();
    const root = document.getElementById('groups');
    for (const g of GROUPS) {
      const sec = document.createElement('section');
      const h = document.createElement('h2'); h.textContent = g.name; sec.append(h);
      const grid = document.createElement('div'); grid.className = 'grid'; sec.append(grid); root.append(sec);
      for (const it of g.items) {
        const card = document.createElement('div'); card.className = 'card';
        const th = document.createElement('div'); th.className = 'thumb';
        const img = document.createElement('img'); img.alt = `${g.name} ${it.title}`; th.append(img);
        const b = document.createElement('b'); b.textContent = it.title;
        const sm = document.createElement('small'); sm.textContent = `${it.w}×${it.h} · ${it.file}`;
        const btn = document.createElement('button'); btn.className = 'btn ghost'; btn.textContent = 'PNGで保存'; btn.disabled = true;
        card.append(th, b, sm, btn); grid.append(card);
        try {
          const canvas = await render(it);
          const blob = await toBlob(canvas);
          rendered.set(it.file, blob);
          img.src = URL.createObjectURL(blob);
          btn.disabled = false;
          btn.addEventListener('click', () => save(it.file, blob, btn));
        } catch (e) { sm.textContent = '描けませんでした: ' + e.message; }
      }
    }
    statusEl.textContent = ok ? '準備ができました。保存したい画像のボタンを押してください' : '丸い文字の形が読みこめなかったので、ほかの文字の形で描いています。通信のよいところで開きなおすと直ります';
    const all = document.getElementById('all'); all.disabled = false;
    all.addEventListener('click', async () => {
      all.disabled = true; statusEl.textContent = 'zip を作っています…';
      const files = [];
      for (const [name, blob] of rendered) files.push({ name, data: new Uint8Array(await blob.arrayBuffer()) });
      all.disabled = false;
      await save('whale-watch_promo-images.zip', zip(files), all);
    });
  }
  (window.claude?.use ? window.claude.use('downloads') : Promise.resolve(null)).then(d => { downloads = d; }).catch(() => {});
  start();
})();
</script>
