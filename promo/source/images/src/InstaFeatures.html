<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0}
a{color:#1f6fa8}a:hover{color:#0b2233}
</style></head><body>

<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 76px 64px 64px; background: #fdf6e3; font-family: 'M PLUS Rounded 1c', sans-serif; color: #0b2233; display: flex; flex-direction: column; gap: 40px">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <p style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 0.2em; color: #2f5d7c">クジラが見てる で</p>
      <h1 style="margin: 0; font-size: 72px; font-weight: 800; line-height: 1.15">できること</h1>
    </div>
    <img src="../img/icon.svg" alt="アプリのアイコン" style="width: 132px; height: 132px; border-radius: 30px">
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; flex-grow: 1">

    <div style="background: #ffffff; border-radius: 32px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 6px 0 #9fd3e6">
      <img src="../img/ja-start.jpg" alt="はじめの画面" style="width: 100%; height: 330px; object-fit: cover; object-position: center 35%">
      <div style="padding: 22px 26px 26px; display: flex; flex-direction: column; gap: 8px">
        <p style="margin: 0; font-size: 34px; font-weight: 800">波の音を流しっぱなし</p>
        <p style="margin: 0; font-size: 22px; line-height: 1.55; font-weight: 500; color: #34556f">タップするだけ。崖の上・上空・間近の3つのカメラ</p>
      </div>
    </div>

    <div style="background: #ffffff; border-radius: 32px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 6px 0 #ffd28a">
      <div style="width: 100%; height: 330px; background: linear-gradient(#78a6ee 0%, #c8e2fa 52%, #2a7ab5 52%, #0b3560 100%); display: flex; align-items: center; justify-content: center; overflow: hidden">
        <img src="../img/whale_side.png" alt="泳ぐザトウクジラ" style="width: 520px; height: 260px">
      </div>
      <div style="padding: 22px 26px 26px; display: flex; flex-direction: column; gap: 8px">
        <p style="margin: 0; font-size: 34px; font-weight: 800">ときどきクジラが来る</p>
        <p style="margin: 0; font-size: 22px; line-height: 1.55; font-weight: 500; color: #34556f">潮吹き、ジャンプ、親子…どんな姿かはお楽しみ</p>
      </div>
    </div>

    <div style="background: #ffffff; border-radius: 32px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 6px 0 #ffd28a">
      <img src="../img/ja-book.jpg" alt="クジラ図鑑の画面" style="width: 100%; height: 330px; object-fit: cover; object-position: center 22%">
      <div style="padding: 22px 26px 26px; display: flex; flex-direction: column; gap: 8px">
        <p style="margin: 0; font-size: 34px; font-weight: 800">写真を撮って図鑑に</p>
        <p style="margin: 0; font-size: 22px; line-height: 1.55; font-weight: 500; color: #34556f">尾びれの模様で見分ける、個性ゆたかな24頭</p>
      </div>
    </div>

    <div style="background: #ffffff; border-radius: 32px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 6px 0 #9fd3e6">
      <img src="../img/ja-sleeptimer.jpg" alt="おやすみタイマーの画面" style="width: 100%; height: 330px; object-fit: cover; object-position: center 38%">
      <div style="padding: 22px 26px 26px; display: flex; flex-direction: column; gap: 8px">
        <p style="margin: 0; font-size: 34px; font-weight: 800">寝かしつけにも</p>
        <p style="margin: 0; font-size: 22px; line-height: 1.55; font-weight: 500; color: #34556f">おやすみタイマーで、波の音が静かに止まる</p>
      </div>
    </div>

  </div>
  <p style="margin: 0; text-align: center; font-size: 28px; font-weight: 800; color: #1f6fa8">インストール不要・無料 ・ #クジラが見てる</p>
</div>
</body></html>
