<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06223f">
  <title>クジラが見てる</title>
  <meta name="description" content="波の音を流しっぱなしにできる海の定点カメラ。ときどきクジラがやってきます。赤ちゃんの寝かしつけや、作業のおともに。">
  <!-- ホーム画面に追加したとき(アプリのように開く) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="クジラが見てる">
  <!-- リンクを送ったときに出る絵と説明(公開する場所が決まったら、絵のアドレスを https:// からに直す) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="クジラが見てる">
  <meta property="og:description" content="波の音と、ときどきクジラ。流しっぱなしにできる海の定点カメラ。">
  <meta property="og:image" content="assets/icons/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      --glass: rgba(10, 18, 28, 0.62);
      --line: rgba(255, 255, 255, 0.16);
      --text: #eef3f7;
      --muted: rgba(238, 243, 247, 0.6);
      --accent: #9fd3e6;
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--text);
      font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    #sea { display: block; width: 100vw; height: 100vh; }
    #ui [hidden] { display: none !important; }

    /* はじめのページ: アプリの紹介・かんたんガイド・広告の場所・スタートボタン */
    .landing { position: fixed; inset: 0; z-index: 30; overflow-y: auto; -webkit-overflow-scrolling: touch;
      background: linear-gradient(rgba(5, 13, 26, 0.35), rgba(5, 13, 26, 0.88) 55%); }
    .landing-inner { box-sizing: border-box; min-height: 100%; width: min(460px, 100%); margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
    .landing-hero { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 12px; }
    .landing-hero img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 0 40px rgba(255, 210, 138, 0.3); }
    .landing-hero h1 { margin: 0; font-size: 34px; letter-spacing: 0.06em; color: #fdf6e3; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5); }
    .landing-hero h1 span { color: #ffd28a; }
    .landing-tag { margin: 0; font-size: 15px; color: rgba(238, 243, 247, 0.9); }
    .landing-start { min-height: 56px; padding: 0 28px; border-radius: 999px; border: 0; background: #ffd28a; color: #0a1a2e;
      font: inherit; font-size: 17px; font-weight: 700; letter-spacing: 0.06em; box-shadow: 0 8px 26px rgba(255, 210, 138, 0.35); cursor: pointer; }
    .landing-start:active { transform: scale(0.98); }
    .start-note { font-size: 12px; letter-spacing: 0.08em; color: rgba(238, 243, 247, 0.78); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5); margin-top: -8px; }
    .landing-guide { width: 100%; box-sizing: border-box; padding: 16px; border: 1px solid var(--line); border-radius: 18px;
      background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); text-align: left; }
    .landing-guide h2 { margin: 0 0 10px; font-size: 14px; letter-spacing: 0.1em; color: #ffd28a; }
    .landing-guide ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
    .landing-guide li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: start; }
    .landing-guide li svg { width: 22px; height: 22px; padding: 6px; border-radius: 10px; background: rgba(159, 211, 230, 0.15); stroke: #9fd3e6; }
    .landing-guide li div { display: flex; flex-direction: column; gap: 2px; }
    .landing-guide b { font-size: 14px; }
    .landing-guide li span { font-size: 12px; line-height: 1.6; color: rgba(238, 243, 247, 0.75); }
    .landing-links { margin: 14px 0 0; display: flex; gap: 8px; justify-content: center; font-size: 13px; }
    .landing-links a { color: #9fd3e6; }
    /* バナー広告の場所 */
    .ad-slot { width: min(var(--w), 100%); height: var(--h); box-sizing: border-box; border: 1px dashed rgba(238, 243, 247, 0.4);
      border-radius: 8px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.05); position: relative; flex-shrink: 0; }
    .ad-slot span { position: absolute; top: 4px; left: 6px; font-size: 10px; letter-spacing: 0.1em; color: rgba(238, 243, 247, 0.6); }
    /* 紹介広告(アフィリエイト)のバナー: 枠の線はなし。左上に「PR」 */
    .ad-slot.aff { border: 0; background: none; height: auto; aspect-ratio: var(--w) / var(--h); padding-top: 18px; box-sizing: content-box; }
    .ad-slot.aff span { top: 0; left: 0; padding: 1px 8px; border-radius: 999px; background: rgba(238, 243, 247, 0.16); color: rgba(238, 243, 247, 0.85); font-weight: 700; }
    .ad-slot.aff a { display: block; width: 100%; height: 100%; }
    .ad-slot.aff a img { display: block; width: 100%; height: 100%; object-fit: contain; border-radius: 6px; }
    .ad-pixel { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    /* 広告動画 */
    .adplayer { position: fixed; inset: 0; z-index: 45; background: #000; display: grid; place-items: center; }
    .adplayer video { width: 100%; height: 100%; object-fit: contain; }
    .ad-badge { position: absolute; top: max(14px, env(safe-area-inset-top)); left: 14px; z-index: 1; padding: 3px 10px; border-radius: 6px;
      background: rgba(255, 210, 138, 0.9); color: #0a1a2e; font-size: 12px; font-weight: 700; }
    .ad-skip { position: absolute; right: 14px; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 1; min-height: 44px; padding: 0 18px;
      border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.5); background: rgba(0, 0, 0, 0.6); color: #fff; font: inherit; font-size: 14px; }
    .ad-skip:disabled { opacity: 0.75; }

    .menu { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%); width: min(440px, calc(100vw - 32px)); box-sizing: border-box;
      padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: var(--glass);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      display: grid; gap: 12px; animation: rise .25s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }
    .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    button { font: inherit; font-size: 14px; color: var(--text); background: transparent;
      border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 40px; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: default; }
    .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .seg button { border: 0; border-radius: 0; flex: 1; }
    .seg button + button { border-left: 1px solid var(--line); }
    .seg button.on { background: rgba(159, 211, 230, 0.22); color: #fff; }
    .cams { width: 100%; }
    .special { display: flex; align-items: center; gap: 10px; }
    .special .label { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; white-space: nowrap; }
    .special .seg { flex: 1; }
    .special button { font-size: 13px; padding: 8px 6px; }
    .summon { border-color: rgba(159, 211, 230, 0.5); color: var(--accent); }
    .status { margin: -4px 0 0; font-size: 13px; color: var(--accent); text-align: right; }
    .volume { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
    .volume input { flex: 1; accent-color: var(--accent); }
    .foot { gap: 8px; }
    .credits { color: var(--muted); font-size: 11px; }
    .full { padding: 6px 10px; min-height: 32px; font-size: 12px; }
    .notice { margin: 0; font-size: 12px; color: #ffd28a; }

    .zukan { position: fixed; inset: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); margin: auto;
      width: min(440px, calc(100vw - 32px)); max-height: min(640px, calc(100vh - 32px)); box-sizing: border-box; overflow: auto;
      padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: rgba(10, 18, 28, 0.86);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 20; }
    .zukan-head { display: flex; align-items: center; justify-content: space-between; }
    .zukan h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.06em; }
    .zukan-note { margin: 8px 0 12px; font-size: 12px; line-height: 1.6; color: var(--muted); }
    .zukan-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .zukan-list li { display: flex; align-items: center; gap: 12px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; }
    .zukan-list canvas { width: 132px; height: 36px; flex: 0 0 auto; }
    .zukan-list b { display: block; font-size: 14px; font-weight: 600; }
    .zukan-list span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .zukan-list .zukan-empty { font-size: 13px; color: var(--muted); }
    .zukan-text { display: grid; gap: 2px; min-width: 0; }
    .zukan-traits { font-size: 11px; line-height: 1.5; color: var(--accent); }
    .zukan-rename { justify-self: start; margin-top: 4px; }
    .zukan-form { display: flex; gap: 6px; align-items: center; }
    .zukan-form input { flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--text); background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
    .photo { border-color: rgba(255, 255, 255, 0.3); }
    .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 30; }
    .flash.go { animation: flash .45s ease-out; }
    @keyframes flash { 0% { opacity: 0.85; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .flash.go { animation-duration: .2s; } }
    .zukan-tabs { margin: 10px 0 2px; }
    .zukan-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px; text-align: left; border-radius: 12px; }
    .zukan-list li { padding: 0; border: 0; }
    .zukan-detail-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0 0; }
    .zukan-name { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 0.04em; overflow-wrap: anywhere; }
    .zukan-sub { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .zukan-portrait { display: block; width: 100%; height: auto; margin: 10px 0 4px; border-radius: 12px;
      background: radial-gradient(ellipse at 50% 40%, rgba(60, 100, 130, 0.55), rgba(8, 22, 34, 0.2)); }
    .zukan-locked { margin: 10px 0 4px; padding: 26px 12px; border: 1px dashed var(--line); border-radius: 12px;
      text-align: center; font-size: 12px; color: var(--muted); }
    .zukan-stats { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 10px 0; font-size: 13px; }
    .zukan-stats dt { color: var(--muted); }
    .zukan-stats dd { margin: 0; font-variant-numeric: tabular-nums; }
    .zukan h4 { margin: 14px 0 6px; font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: 0.04em; }
    .zukan-comment { margin: 0; font-size: 13px; line-height: 1.7; }
    .zukan-dim { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
    .zukan-next { margin: 8px 0 0; font-size: 12px; color: #ffd28a; }
    .zukan canvas { max-width: 100%; height: auto; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
    .photo-thumb { padding: 0; border: 0; border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 10; min-height: 0; }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-view { position: fixed; inset: 0; z-index: 25; display: grid; place-content: center; gap: 10px; padding: 16px;
      background: rgba(0, 0, 0, 0.86); }
    .photo-view[hidden] { display: none; }
    .photo-view img { max-width: calc(100vw - 32px); max-height: calc(100vh - 140px); border-radius: 10px; }
    .photo-caption { margin: 0; text-align: center; font-size: 13px; color: var(--text); }
    .photo-actions { display: flex; gap: 8px; justify-content: center; }
    .photo-btn { display: inline-flex; align-items: center; color: var(--text); text-decoration: none; border: 1px solid var(--line); border-radius: 10px; }
    .debug select { font: inherit; font-size: 12px; color: var(--text); background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line);
      border-radius: 8px; padding: 6px; max-width: 100%; }
    /* ---- 操作パネル(カメラアプリのような形) ---- */
    .hud { position: fixed; inset: 0; pointer-events: none; animation: hudIn .25s ease-out; }
    @keyframes hudIn { from { opacity: 0; } }
    .hud > * { pointer-events: auto; }
    .hud-top { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 14px; right: 14px; display: flex;
      justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
    .hud-top > * { pointer-events: auto; }
    .pill { background: rgba(10, 18, 28, 0.62); border-radius: 999px; padding: 9px 14px; font-size: 13px;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .hud-round { display: flex; gap: 8px; flex: 0 0 auto; }
    /* 使い方: パネルの左上(場所の下)のボタンと、はじめのページのガイドのボタン */
    .hud-left { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; flex: 1 1 auto; pointer-events: none !important; }
    .hud-left > * { pointer-events: auto; }
    .hud-left .pill { max-width: 100%; box-sizing: border-box; }
    .help-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px 0 10px; border-radius: 999px; font-size: 13px; font-weight: 700;
      color: #fdf6e3; background: rgba(10, 18, 28, 0.62); border: 1px solid rgba(255, 210, 138, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .help-chip svg, .landing-guide-btn svg, .tour-guide svg { stroke: #ffd28a; }
    .landing-guide-btn { margin: 14px 0 0; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; border-radius: 999px;
      border: 1px solid rgba(255, 210, 138, 0.7); color: #fdf6e3; font-size: 14px; font-weight: 700; text-decoration: none; background: rgba(255, 210, 138, 0.1); }
    .landing-guide-btn:active { background: rgba(255, 210, 138, 0.22); }
    /* チュートリアル: 画面を暗くして、ボタンを1つずつ照らす */
    .tour { position: fixed; inset: 0; z-index: 46; }
    .tour[hidden], .tour-spot[hidden], .tour-guide[hidden], .tour-skip[hidden] { display: none; }
    .tour.dim { background: rgba(2, 8, 16, 0.66); }
    .tour-spot { position: fixed; box-shadow: 0 0 0 200vmax rgba(2, 8, 16, 0.66), 0 0 0 3px #ffd28a; pointer-events: none; transition: all .25s ease; }
    .tour-card { position: fixed; box-sizing: border-box; padding: 16px 16px 12px; border-radius: 18px; background: #fdf6e3; color: #0b2233;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4); display: flex; flex-direction: column; gap: 10px; transition: top .25s ease, left .25s ease; }
    .tour-text { margin: 0; font-size: 15px; line-height: 1.7; }
    .tour-guide { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #1f6fa8; }
    .tour-guide svg { stroke: #1f6fa8; }
    .tour-row { display: flex; align-items: center; gap: 8px; }
    .tour-count { flex: 1; font-size: 12px; color: #4a6478; font-variant-numeric: tabular-nums; }
    .tour-skip { min-height: 40px; border: 0; background: transparent; color: #4a6478; font-size: 14px; }
    .tour-next { min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: #1f6fa8; color: #fff; font-size: 15px; font-weight: 700; }
    .tour-next:focus-visible, .tour-skip:focus-visible { outline: 3px solid #ffd28a; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .tour-spot, .tour-card { transition: none; } }
    .round { width: 48px; height: 48px; min-height: 48px; padding: 0; border-radius: 50%; background: rgba(10, 18, 28, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.2); color: var(--text); display: inline-flex; align-items: center; justify-content: center;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .round.on { background: rgba(159, 211, 230, 0.3); border-color: rgba(159, 211, 230, 0.7); }
    /* タイマー: 右上の時計のボタンから。決めているあいだは右上に残り時間、鳴ったら「時間です」と止めるボタン */
    .timer-pop { position: fixed; top: calc(max(16px, env(safe-area-inset-top)) + 58px); right: 14px; width: min(320px, calc(100vw - 28px));
      box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 14px; font-size: 13px; z-index: 6;
      background: rgba(10, 18, 28, 0.9); border: 1px solid var(--line); border-radius: 16px; }
    .timer-pop[hidden], .timer-mark[hidden], .alarm[hidden] { display: none; }
    .timer-now { margin: 0; line-height: 1.5; }
    .timer-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .timer-chips button, .timer-clock button, .timer-cancel { font: inherit; font-size: 13px; color: var(--text); min-height: 40px; padding: 0 12px;
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 999px; }
    .timer-clock { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .timer-clock label { display: flex; align-items: center; gap: 8px; }
    .timer-clock input { font: inherit; font-size: 15px; color: var(--text); background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 10px; min-height: 40px; padding: 0 8px; color-scheme: dark; }
    .timer-cancel { align-self: flex-start; color: #ffd0c8; border-color: rgba(255, 180, 170, 0.45); }
    .timer-pop small { color: rgba(238, 243, 247, 0.65); line-height: 1.5; }
    .interval { border-top: 1px solid rgba(255, 255, 255, 0.14); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .interval-title { margin: 0; font-weight: 700; }
    .interval-chips { display: flex; gap: 6px; }
    .interval-chips button { flex: 1 1 0; min-width: 0; }
    .interval-chips button[hidden], .pick-open[hidden] { display: none !important; }
    .interval-chips button { font: inherit; color: var(--text); background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px; min-height: 52px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .interval-chips b { font-size: 13px; }
    .interval-chips span { font-size: 10.5px; color: rgba(238, 243, 247, 0.7); }
    .interval-chips button.on { background: #9fd3e6; color: #0b2233; border-color: #9fd3e6; }
    .interval-chips button.on span { color: #16405a; }
    /* プラス: 「えらんで呼ぶ」と、案内のカード。使えないところには小さな「プラス」の札 */
    .plus-tag { font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: #3a2a08; background: #ffd28a;
      border-radius: 999px; padding: 1px 7px; line-height: 1.5; }
    .plus-tag[hidden] { display: none; }
    .interval-chips button { position: relative; }
    .interval-chips .plus-tag { position: absolute; top: -8px; right: -4px; }
    .pick-open { justify-self: center; width: auto !important; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; min-height: 40px;
      padding: 0 16px; border-radius: 999px; background: rgba(255, 210, 138, 0.12); border: 1px solid rgba(255, 210, 138, 0.55); color: #ffe7c2; }
    .pick-open[aria-expanded="true"] { background: rgba(255, 210, 138, 0.28); }
    .pick-pop { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom)); z-index: 7;
      width: min(440px, calc(100vw - 28px)); max-height: min(70vh, 560px); overflow-y: auto; box-sizing: border-box; padding: 14px;
      display: flex; flex-direction: column; gap: 10px; font-size: 13px; background: rgba(10, 18, 28, 0.97); border: 1px solid rgba(255, 210, 138, 0.5);
      border-radius: 18px; }
    .pick-pop[hidden], .plus-sheet[hidden] { display: none; }
    .pick-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .pick-head p { margin: 0; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: #ffe7c2; }
    .pick-close { width: 40px; height: 40px; min-height: 40px; padding: 0; border-radius: 50%; font-size: 20px; line-height: 1;

    /* 右上の丸いボタンが5つになっても、せまい画面に収まるように */

    /* 画面を真っ暗に(音はそのまま)。「タップでもどります」は少しして消える */

    /* おやすみタイマーが終わったとき */

      margin: 0; padding: 12px 16px; border-radius: 16px; background: #fdf6e3; color: #0b2233; font-size: 14px; line-height: 1.6; text-align: center;

    /* 新しい版のお知らせ */
    .update { position: fixed; z-index: 41; top: calc(max(16px, env(safe-area-inset-top)) + 60px); left: 50%; transform: translateX(-50%);

    /* パネルを閉じても残る写真のボタン(左下・真ん中・右下) */
    .float-shutter { position: fixed; bottom: max(22px, calc(env(safe-area-inset-bottom) + 12px)); z-index: 6;

    .timer-mark { position: fixed; top: max(18px, env(safe-area-inset-top)); left: 18px; z-index: 5; color: #cfe6f0; opacity: 0.4;

    .alarm { position: fixed; left: 50%; top: 24%; transform: translate(-50%, -50%); z-index: 20; width: min(320px, calc(100vw - 32px));
