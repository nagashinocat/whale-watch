<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// 宣伝動画(縦 1080x1920)。frame(t) で、t 秒の絵を描く(時間をとめて1コマずつ撮る)
const W = 1080, H = 1920;
const ctx = document.getElementById('c').getContext('2d');
const FONT = '"Noto Sans CJK JP", sans-serif';
const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
const IMG = {};
const clamp = x => Math.min(1, Math.max(0, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (i) => { const x = Math.sin(i * 127.1 + 31.7) * 43758.5453; return x - Math.floor(x); };

// シーン(秒)
const SCENES = [
  { name: 'open', from: 0, to: 4.2 },
  { name: 'waves', from: 4.2, to: 9.4 },
  { name: 'breach', from: 9.4, to: 15.4 },
  { name: 'book', from: 15.4, to: 20.8 },
  { name: 'night', from: 20.8, to: 25.8 },
  { name: 'end', from: 25.8, to: 30 },
];

function sky(top, mid, bottom, horizon) {
  const g = ctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, top); g.addColorStop(0.6, mid); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, horizon);
}
function sea(t, horizon, near, far, glint, amount = 1) {
  const g = ctx.createLinearGradient(0, horizon, 0, H);
  g.addColorStop(0, far); g.addColorStop(1, near);
  ctx.fillStyle = g; ctx.fillRect(0, horizon, W, H - horizon);
  // 水面のきらめき: 遠くは細く短く、近くは長い。ゆっくり横へ流れる
  ctx.strokeStyle = glint; ctx.lineCap = 'round';
  for (let i = 0; i < 260; i++) {
    const d = Math.pow(rnd(i), 1.8);           // 0 遠く 〜 1 近く
    const y = horizon + d * (H - horizon) + 6;
    const len = 6 + 70 * d;
    const x = ((rnd(i + 99) * (W + 200) + t * (12 + 30 * d) * (rnd(i + 7) < 0.5 ? 1 : -1)) % (W + 200) + W + 200) % (W + 200) - 100;
    const a = (0.25 + 0.6 * Math.abs(Math.sin(t * (0.8 + rnd(i + 3)) + i))) * amount;
    ctx.globalAlpha = a; ctx.lineWidth = 1.5 + 3 * d;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function stars(t, n, maxY, alpha = 1) {
  for (let i = 0; i < n; i++) {
    const x = rnd(i + 500) * W, y = rnd(i + 900) * maxY;
    const r = 0.8 + 2.2 * Math.pow(rnd(i + 40), 3);
    ctx.globalAlpha = alpha * (0.35 + 0.65 * Math.abs(Math.sin(t * (0.6 + rnd(i)) + i)));
    ctx.fillStyle = '#fdf6e3'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function rounded(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
// スマホの画面(本物の操作画面の写真)
function phone(img, cx, cy, w, rot = 0, alpha = 1) {
  const h = w * img.height / img.width, b = w * 0.035;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 24;
  ctx.fillStyle = '#0b1320'; rounded(-w / 2 - b, -h / 2 - b, w + 2 * b, h + 2 * b, w * 0.13); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.save(); rounded(-w / 2, -h / 2, w, h, w * 0.1); ctx.clip(); ctx.drawImage(img, -w / 2, -h / 2, w, h); ctx.restore();
  ctx.restore();
}
// 字幕: 大きな1行と、小さな1行
function caption(text, sub, alpha, y, color = '#ffffff') {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,10,30,0.55)'; ctx.shadowBlur = 24;
  ctx.fillStyle = color; ctx.font = `700 76px ${FONT}`;
  const lines = text.split('\n');
  lines.forEach((l, i) => ctx.fillText(l, W / 2, y + i * 100 + (1 - alpha) * 18));
  if (sub) { ctx.font = `500 40px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,0.88)'; ctx.fillText(sub, W / 2, y + lines.length * 100 + 6 + (1 - alpha) * 18); }
  ctx.restore();
}
const fadeIO = (lt, d, fin = 0.5, fout = 0.5) => Math.min(ease(lt / fin), ease((d - lt) / fout));

// ---- 1. はじまり: 夜空に、見守る目 ----
function open(lt, d) {
  sky('#050d1a', '#0a1a2e', '#12304d', 1400);
  stars(lt, 140, 1300);
  sea(lt, 1400, '#0d2f4f', '#1c4f7a', '#7fb8e0', 0.6);
  const s = lerp(0.88, 1, easeOut(lt / 2.4));
  const a = ease(lt / 0.9);
  const size = 560 * s;
  ctx.save(); ctx.globalAlpha = a;
  ctx.shadowColor = 'rgba(255,210,138,0.45)'; ctx.shadowBlur = 90;
  rounded(W / 2 - size / 2, 560 - size / 2, size, size, size * 0.225); ctx.clip();
  ctx.drawImage(IMG.icon, W / 2 - size / 2, 560 - size / 2, size, size);
  ctx.restore();
  const ta = ease((lt - 1.2) / 0.8);
  ctx.save(); ctx.globalAlpha = ta; ctx.textAlign = 'center'; ctx.fillStyle = '#fdf6e3';
  ctx.font = `700 120px ${FONT}`;
  const y = 1040 + (1 - ta) * 20;
  const parts = [['クジラが', '#fdf6e3'], ['見', '#ffd28a'], ['てる', '#fdf6e3']];
  const widths = parts.map(([s]) => ctx.measureText(s).width), total = widths.reduce((x, v) => x + v, 0);
  let x = W / 2 - total / 2; ctx.textAlign = 'left';
  parts.forEach(([s, c], i) => { ctx.fillStyle = c; ctx.fillText(s, x, y); x += widths[i]; });
  ctx.textAlign = 'center'; ctx.font = `500 40px ${FONT}`; ctx.fillStyle = '#9fb8cc';
  ctx.fillText('W H A L E   W A T C H', W / 2, y + 80);
  ctx.restore();
  caption('海のむこうから、\nクジラたちが見守っています', null, ease((lt - 2.2) / 0.7) * 0.9, 1250, '#e8eef5');
  // 終わりは暗く
  ctx.fillStyle = `rgba(0,0,0,${ease((lt - (d - 0.45)) / 0.45)})`; ctx.fillRect(0, 0, W, H);
}

// ---- 2. 波の音を、流しっぱなし ----
function waves(lt, d) {
  sky('#2c5fd6', '#5d8fe6', '#a9cdf2', 760);
  sea(lt, 760, '#0b3560', '#1f6fa8', '#cfe9ff');
  // 遠くで、背中を見せるクジラ
  const k = clamp((lt - 0.4) / 3.6);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, 812); ctx.clip();
  const wx = lerp(260, 420, k), wy = 830 - 34 * Math.sin(Math.PI * clamp((lt - 0.6) / 3.4));
  ctx.globalAlpha = 0.95; ctx.drawImage(IMG.side, wx - 300, wy - 150, 600, 300);
  ctx.restore();
  // 潮吹き
  const blow = clamp((lt - 1.2) / 1.6);
  if (blow > 0 && blow < 1) {
    for (let i = 0; i < 40; i++) {
      const h = blow * (120 + 60 * rnd(i)), spread = (rnd(i + 3) - 0.5) * 60 * blow;
      ctx.globalAlpha = 0.35 * (1 - blow) * (0.5 + rnd(i + 5));
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(wx + 150 + spread, 800 - h, 10 + 16 * blow * rnd(i + 8), 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  phone(IMG.start, W / 2, lerp(2300, 1350, easeOut((lt - 0.5) / 1.4)), 470, -0.03);
  caption('波の音を、\n流しっぱなし。', 'タップするだけ。寝かしつけやBGMに', fadeIO(lt - 0.3, d - 0.3, 0.6, 0.5), 230);
  ctx.fillStyle = `rgba(0,0,0,${ease((lt - (d - 0.35)) / 0.35)})`; ctx.fillRect(0, 0, W, H);
}

// ---- 3. ジャンプ ----
const SPLASH = Array.from({ length: 420 }, (_, i) => ({ a: (rnd(i) - 0.5) * 2.2, v: 500 + 900 * rnd(i + 1), r: 2 + 7 * rnd(i + 2), d: rnd(i + 3) }));
function splash(t0, lt, x, y, scale) {
  const tt = lt - t0;
  if (tt < 0 || tt > 2.4) return;
  ctx.fillStyle = '#ffffff';
  for (const p of SPLASH) {
    const vx = Math.sin(p.a) * p.v * 0.55, vy = -Math.cos(p.a) * p.v;
    const px = x + vx * tt * scale, py = y + (vy * tt + 0.5 * 980 * tt * tt) * scale;
    if (py > y + 30) continue;
    ctx.globalAlpha = 0.85 * (1 - tt / 2.4) * (0.5 + 0.5 * p.d);
    ctx.beginPath(); ctx.arc(px, py, p.r * scale * (1 + 0.4 * tt), 0, 7); ctx.fill();
  }
  // 白い泡
  ctx.globalAlpha = 0.7 * (1 - tt / 2.4);
  ctx.beginPath(); ctx.ellipse(x, y + 10, 260 * scale * (0.6 + tt), 40 * scale * (0.6 + tt * 0.5), 0, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
}
function breach(lt, d) {
  sky('#3b6fe0', '#78a6ee', '#c8e2fa', 900);
  sea(lt, 900, '#0b3560', '#1f6fa8', '#d8efff');
  const water = 1180;
  // 飛び出して(0.9秒〜)、いちばん高くなって、横向きに倒れる
  const k = clamp((lt - 0.9) / 2.6);
  const y = water + 520 - 1150 * Math.sin(Math.PI * k) * (k < 0.5 ? 1 : 1);
  const rot = lerp(-0.15, 1.25, ease((k - 0.15) / 0.85));
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, water + 8); ctx.clip();
  ctx.translate(W / 2 + 40 * k, y); ctx.rotate(rot);
  ctx.drawImage(IMG.breach, -500, -500, 1000, 1000);
  ctx.restore();
  splash(0.95, lt, W / 2, water, 1);
  splash(3.4, lt, W / 2 + 160, water, 1.15);
  caption('ときどき、\nクジラがやってくる。', 'いつ、どんな姿で来るかはお楽しみ', fadeIO(lt - 0.2, d - 0.2, 0.6, 0.6), 230);
  ctx.fillStyle = `rgba(0,0,0,${ease((lt - (d - 0.35)) / 0.35)})`; ctx.fillRect(0, 0, W, H);
}

// ---- 4. 写真と図鑑 ----
function book(lt, d) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#fdf6e3'); g.addColorStop(1, '#cfe9f5');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 水玉の飾り
  for (let i = 0; i < 18; i++) { ctx.globalAlpha = 0.18; ctx.fillStyle = i % 2 ? '#9fd3e6' : '#ffd28a'; ctx.beginPath(); ctx.arc(rnd(i + 70) * W, rnd(i + 80) * H, 30 + 70 * rnd(i + 90), 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  const a = easeOut((lt - 0.2) / 1.0), b = easeOut((lt - 1.1) / 1.0);
  phone(IMG.book, lerp(-400, 340, a), 1180, 430, -0.06);
  phone(IMG.whale, lerp(1500, 740, b), 1260, 430, 0.05);
  // カメラのシャッター
  const flash = clamp(1 - Math.abs(lt - 2.6) / 0.18);
  ctx.save(); ctx.globalAlpha = ease((lt - 0.3) / 0.5);
  ctx.textAlign = 'center'; ctx.font = `700 76px ${FONT}`; ctx.fillStyle = '#0b2233';
  ctx.fillText('写真を撮って、', W / 2, 250); ctx.fillText('図鑑をうめよう', W / 2, 350);
  ctx.font = `500 40px ${FONT}`; ctx.fillStyle = '#2f5d7c';
  ctx.fillText('尾びれの模様で、1頭ずつ見分けられる', W / 2, 440);
  ctx.restore();
  // 「24頭」の札
  const p = easeOut((lt - 1.9) / 0.6);
  if (p > 0) {
    ctx.save(); ctx.translate(W / 2, 1830 - 40 * p); ctx.globalAlpha = p;
    ctx.fillStyle = '#ffd28a'; rounded(-230, -52, 460, 104, 52); ctx.fill();
    ctx.fillStyle = '#3a2a08'; ctx.textAlign = 'center'; ctx.font = `700 46px ${FONT}`; ctx.fillText('個性ゆたかな 24頭', 0, 16);
    ctx.restore();
  }
  ctx.fillStyle = `rgba(255,255,255,${flash * 0.8})`; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = `rgba(0,0,0,${ease((lt - (d - 0.35)) / 0.35)})`; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = `rgba(0,0,0,${1 - ease(lt / 0.3)})`; ctx.fillRect(0, 0, W, H);
}

// ---- 5. 夜と、寝かしつけ ----
function night(lt, d) {
  sky('#040a14', '#0a1a2e', '#16365a', 900);
  stars(lt, 160, 880);
  // 月
  ctx.save(); ctx.shadowColor = 'rgba(255,235,190,0.7)'; ctx.shadowBlur = 60; ctx.fillStyle = '#fff3cf';
  ctx.beginPath(); ctx.arc(830, 640, 56, 0, 7); ctx.fill(); ctx.restore();
  sea(lt, 900, '#06182b', '#123a5c', '#ffe9b8', 0.7);
  phone(IMG.sleep, W / 2, lerp(2300, 1300, easeOut((lt - 0.3) / 1.3)), 470, 0.02);
  caption('寝かしつけにも。', 'おやすみタイマーで、波の音が静かに止まる', fadeIO(lt - 0.2, d - 0.2, 0.6, 0.5), 300);
  // 最後に画面が真っ暗に(真っ暗画面)
  ctx.fillStyle = `rgba(0,0,0,${ease((lt - (d - 0.6)) / 0.6)})`; ctx.fillRect(0, 0, W, H);
}

// ---- 6. おわり ----
function end(lt, d) {
  sky('#050d1a', '#0a1a2e', '#12304d', 1500);
  stars(lt + 20, 140, 1400);
  sea(lt, 1500, '#0d2f4f', '#2a6d9e', '#9fd3e6', 0.7);
  const a = ease(lt / 0.6);
  ctx.save(); ctx.globalAlpha = a;
  const size = 360;
  ctx.shadowColor = 'rgba(255,210,138,0.4)'; ctx.shadowBlur = 70;
  rounded(W / 2 - size / 2, 520 - size / 2, size, size, size * 0.225); ctx.clip();
  ctx.drawImage(IMG.icon, W / 2 - size / 2, 520 - size / 2, size, size);
  ctx.restore();
  ctx.save(); ctx.globalAlpha = ease((lt - 0.3) / 0.6); ctx.textAlign = 'center';
  ctx.font = `700 104px ${FONT}`;
  const parts = [['クジラが', '#fdf6e3'], ['見', '#ffd28a'], ['てる', '#fdf6e3']];
  const widths = parts.map(([s]) => ctx.measureText(s).width), total = widths.reduce((x, v) => x + v, 0);
  let x = W / 2 - total / 2; ctx.textAlign = 'left';
  parts.forEach(([s, c], i) => { ctx.fillStyle = c; ctx.fillText(s, x, 860); x += widths[i]; });
  ctx.textAlign = 'center';
  ctx.font = `500 38px ${FONT}`; ctx.fillStyle = '#9fb8cc'; ctx.fillText('W H A L E   W A T C H', W / 2, 935);
  ctx.restore();
  ctx.save(); ctx.globalAlpha = ease((lt - 0.9) / 0.6); ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd28a'; rounded(W / 2 - 330, 1060, 660, 120, 60); ctx.fill();
  ctx.fillStyle = '#0a1a2e'; ctx.font = `700 52px ${FONT}`; ctx.fillText('ブラウザで、すぐに。', W / 2, 1140);
  ctx.fillStyle = '#e8eef5'; ctx.font = `500 40px ${FONT}`;
  ctx.fillText('インストール不要・無料', W / 2, 1260);
  ctx.fillText('#クジラが見てる', W / 2, 1330);
  ctx.restore();
}

const DRAW = { open, waves, breach, book, night, end };
window.frame = t => {
  const s = SCENES.find(s => t >= s.from && t < s.to) ?? SCENES[SCENES.length - 1];
  ctx.clearRect(0, 0, W, H);
  ctx.save(); DRAW[s.name](t - s.from, s.to - s.from); ctx.restore();
};
window.SCENES = SCENES;
Promise.all([
  load('icon.svg').then(i => IMG.icon = i), load('whale_side.png').then(i => IMG.side = i), load('whale_breach.png').then(i => IMG.breach = i),
  load('ja-start.jpg').then(i => IMG.start = i), load('ja-book.jpg').then(i => IMG.book = i), load('ja-whale.jpg').then(i => IMG.whale = i),
  load('ja-sleeptimer.jpg').then(i => IMG.sleep = i),
]).then(() => document.fonts.load(`700 76px ${FONT}`)).then(() => { window.ready = true; });
</script></body></html>
